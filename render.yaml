# Render Blueprint — 后端 API + PostgreSQL（前端部署在 Vercel）
services:
  - type: web
    name: taskflakes-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm ci && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: taskflakes-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      # 部署完 Vercel 前端后，把下面改成你的 Vercel 域名（如 https://taskflakes.vercel.app）
      - key: CORS_ORIGIN
        value: https://taskflakes.vercel.app
      - key: PORT
        value: 10000

databases:
  - name: taskflakes-db
    region: oregon
    plan: free
