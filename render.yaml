services:
  - type: web
    name: assignment-tracker-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm ci && npx prisma generate
    startCommand: cd backend && npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: assignment-tracker-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: CORS_ORIGIN
        value: https://assignment-tracker-web.onrender.com
      - key: PORT
        value: 10000

  - type: static
    name: assignment-tracker-web
    region: oregon
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://assignment-tracker-api.onrender.com
      - key: VITE_APP_NAME
        value: "Assignments Tracker"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://assignment-tracker-api.onrender.com/api/*

databases:
  - name: assignment-tracker-db
    region: oregon
    plan: free
